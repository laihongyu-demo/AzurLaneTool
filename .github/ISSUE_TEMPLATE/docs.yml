name: "文档"
description: "规范、方案、报告、README 或注释的补充与修订。"
title: "[文档] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        文档问题也要给证据：哪一节、哪句话、与代码/数据哪里不一致。
        新文档命名：`docs/YYYYMMDD_主题.md`；旧文件不追溯改名。

  - type: textarea
    id: scope
    attributes:
      label: "背景 / 文档范围"
      description: "涉及哪个文件/章节？为什么要改？"
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "变更内容"
      description: "补充/修正/删除什么；与代码、测试、数据口径如何对齐。"
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: "验证 / 链接"
      description: "相关代码行、issue、报告或渲染检查；不需要跑测试时说明原因。"
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: "关联"
      description: "相关 issue / PR / docs。"

  - type: checkboxes
    id: checks
    attributes:
      label: "提交前检查"
      options:
        - label: "我已确认文档与当前代码/口径一致"
          required: true
